<svg viewBox="0 0 3840 2160" width="3840" height="2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A0C"/>
      <stop offset="40%" stop-color="#0D1417"/>
      <stop offset="100%" stop-color="#121D22"/>
    </linearGradient>

    <!-- Energy Emerald Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CE293"/>
      <stop offset="100%" stop-color="#1FA35C"/>
    </linearGradient>

    <!-- Solar Panel Blue/Cyan Gradient -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE17D"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <!-- Battery Status Gradient -->
    <linearGradient id="bessGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="85%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#4CE293" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="3840" height="2160" fill="url(#bgGrad)"/>
  <rect width="3840" height="2160" fill="url(#grid)"/>

  <!-- ==================== RENEWABLE ENERGY SYSTEM DISPLAY 1: SOLAR PV ARRAY (LEFT) ==================== -->
  <g transform="translate(250, 1150)">
    <!-- Solar Panel Mounting Frame -->
    <path d="M 0 350 L 500 350 M 100 350 L 100 500 M 400 350 L 400 500" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Tilted Solar Array Group -->
    <g transform="skewX(-20) rotate(-10)">
      <!-- Panel 1 -->
      <rect x="0" y="0" width="220" height="320" rx="10" fill="url(#solarGrad)" stroke="#0284C7" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
      <path d="M 0 80 L 220 80 M 0 160 L 220 160 M 0 240 L 220 240 M 73 0 L 73 320 M 146 0 L 146 320" stroke="#BAE6FD" stroke-width="2" opacity="0.6"/>

      <!-- Panel 2 -->
      <rect x="250" y="0" width="220" height="320" rx="10" fill="url(#solarGrad)" stroke="#0284C7" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
      <path d="M 250 80 L 470 80 M 250 160 L 470 160 M 250 240 L 470 240 M 323 0 L 323 320 M 396 0 L 396 320" stroke="#BAE6FD" stroke-width="2" opacity="0.6"/>

      <!-- Panel 3 -->
      <rect x="500" y="0" width="220" height="320" rx="10" fill="url(#solarGrad)" stroke="#0284C7" stroke-width="6" opacity="0.9" filter="url(#glow)"/>
      <path d="M 500 80 L 720 80 M 500 160 L 720 160 M 500 240 L 720 240 M 573 0 L 573 320 M 646 0 L 646 320" stroke="#BAE6FD" stroke-width="2" opacity="0.6"/>
    </g>
    <text x="260" y="480" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#38BDF8" letter-spacing="3">SOLAR PV GENERATION ARRAY</text>
  </g>

  <!-- ==================== RENEWABLE ENERGY SYSTEM DISPLAY 2: WIND TURBINES (LEFT-CENTER) ==================== -->
  <g transform="translate(1000, 750)">
    <!-- Tower 1 -->
    <path d="M 120 700 L 145 200 L 155 200 L 180 700 Z" fill="#1E293B" stroke="#475569" stroke-width="4"/>
    <!-- Nacelle & Hub -->
    <circle cx="150" cy="200" r="22" fill="#334155" stroke="#4CE293" stroke-width="4"/>
    <!-- Rotor Blades -->
    <g transform="translate(150, 200)">
      <!-- Blade 1 -->
      <path d="M 0 0 C -15 -80 -10 -180 0 -220 C 10 -180 15 -80 0 0 Z" fill="url(#energyGrad)" filter="url(#glow)"/>
      <!-- Blade 2 -->
      <g transform="rotate(120)">
        <path d="M 0 0 C -15 -80 -10 -180 0 -220 C 10 -180 15 -80 0 0 Z" fill="url(#energyGrad)" filter="url(#glow)"/>
      </g>
      <!-- Blade 3 -->
      <g transform="rotate(240)">
        <path d="M 0 0 C -15 -80 -10 -180 0 -220 C 10 -180 15 -80 0 0 Z" fill="url(#energyGrad)" filter="url(#glow)"/>
      </g>
      <circle cx="0" cy="0" r="10" fill="#4CE293"/>
    </g>

    <!-- Tower 2 (Background Smaller Turbine) -->
    <g transform="translate(300, 100) scale(0.7)">
      <path d="M 120 700 L 145 200 L 155 200 L 180 700 Z" fill="#1E293B" stroke="#475569" stroke-width="4"/>
      <circle cx="150" cy="200" r="22" fill="#334155" stroke="#4CE293" stroke-width="4"/>
      <g transform="translate(150, 200) rotate(45)">
        <path d="M 0 0 C -15 -80 -10 -180 0 -220 C 10 -180 15 -80 0 0 Z" fill="url(#energyGrad)"/>
        <g transform="rotate(120)"><path d="M 0 0 C -15 -80 -10 -180 0 -220 C 10 -180 15 -80 0 0 Z" fill="url(#energyGrad)"/></g>
        <g transform="rotate(240)"><path d="M 0 0 C -15 -80 -10 -180 0 -220 C 10 -180 15 -80 0 0 Z" fill="url(#energyGrad)"/></g>
      </g>
    </g>
    <text x="30" y="740" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#4CE293" letter-spacing="3">WIND TURBINE FARM</text>
  </g>

  <!-- ==================== RENEWABLE ENERGY SYSTEM DISPLAY 3: BATTERY STORAGE BESS (RIGHT-CENTER) ==================== -->
  <g transform="translate(2250, 1200)">
    <!-- Container Body -->
    <rect x="0" y="0" width="550" height="320" rx="16" fill="#0F172A" stroke="#334155" stroke-width="8"/>
    <!-- Ventilation Grills -->
    <path d="M 40 40 L 40 280 M 70 40 L 70 280 M 100 40 L 100 280" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
    <!-- Battery Racks & Status Gauge -->
    <rect x="150" y="50" width="350" height="60" rx="8" fill="#1E293B"/>
    <rect x="155" y="55" width="300" height="50" rx="6" fill="url(#bessGrad)" filter="url(#glow)"/>
    <text x="470" y="90" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#10B981">92%</text>

    <rect x="150" y="130" width="350" height="60" rx="8" fill="#1E293B"/>
    <rect x="155" y="135" width="280" height="50" rx="6" fill="url(#bessGrad)" filter="url(#glow)"/>
    <text x="470" y="170" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#10B981">85%</text>

    <rect x="150" y="210" width="350" height="60" rx="8" fill="#1E293B"/>
    <rect x="155" y="215" width="320" height="50" rx="6" fill="url(#bessGrad)" filter="url(#glow)"/>
    <text x="470" y="250" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#10B981">96%</text>

    <text x="80" y="380" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#10B981" letter-spacing="3">BESS BATTERY STORAGE</text>
  </g>

  <!-- ==================== RENEWABLE ENERGY SYSTEM DISPLAY 4: MICROGRID PYLON GRID (RIGHT) ==================== -->
  <g transform="translate(3050, 950)">
    <!-- Transmission Pylon Tower -->
    <path d="M 200 700 L 280 200 L 320 200 L 400 700 Z" fill="none" stroke="#475569" stroke-width="6"/>
    <!-- Cross Arms -->
    <line x1="180" y1="300" x2="420" y2="300" stroke="#475569" stroke-width="8"/>
    <line x1="150" y1="420" x2="450" y2="420" stroke="#475569" stroke-width="8"/>
    <line x1="120" y1="540" x2="480" y2="540" stroke="#475569" stroke-width="8"/>
    <!-- Lattice Bracing -->
    <path d="M 260 300 L 340 420 M 340 300 L 260 420 M 240 420 L 360 540 M 360 420 L 240 540" stroke="#334155" stroke-width="4"/>

    <!-- Power Transmission Lines -->
    <path d="M -500 300 Q 0 340 180 300 M 420 300 Q 600 340 800 300" fill="none" stroke="#FFE17D" stroke-width="4" filter="url(#glow)"/>
    <path d="M -500 420 Q 0 460 150 420 M 450 420 Q 600 460 800 420" fill="none" stroke="#4CE293" stroke-width="4" filter="url(#glow)"/>

    <text x="140" y="740" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#FFE17D" letter-spacing="3">MICROGRID POWER BUS</text>
  </g>

  <!-- ==================== CENTRAL BRAND BADGE ==================== -->
  <g transform="translate(1920, 850)">
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="320" fill="#4CE293" opacity="0.04" filter="url(#glow)"/>

    <!-- Terminal Frame Badge -->
    <rect x="-240" y="-180" width="480" height="360" rx="32" fill="#090E10" stroke="url(#energyGrad)" stroke-width="12" filter="url(#glow)"/>
    <line x1="-240" y1="-100" x2="240" y2="-100" stroke="url(#energyGrad)" stroke-width="8"/>
    <circle cx="-190" cy="-140" r="12" fill="#4CE293"/>
    <circle cx="-150" cy="-140" r="12" fill="#4CE293" opacity="0.5"/>
    <circle cx="-110" cy="-140" r="12" fill="#4CE293" opacity="0.3"/>

    <!-- Gold Prompt Caret -->
    <path d="M -180 -30 L -120 15 L -180 60" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-90" y1="60" x2="-20" y2="60" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Energy Bolt -->
    <path d="M 100 -60 L 50 35 L 82 35 L 70 120 L 135 15 L 100 15 Z" fill="url(#energyGrad)" filter="url(#glow)"/>
  </g>

  <!-- Main Wordmark -->
  <text x="1920" y="1320" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', sans-serif" font-weight="800" font-size="110" fill="#F8FAFC" letter-spacing="4">
    Wire<tspan fill="#4CE293">Bus</tspan><tspan fill="#F8FAFC" font-weight="300">OS</tspan>
  </text>

  <text x="1920" y="1390" text-anchor="middle" font-family="'Inter', 'DejaVu Sans', sans-serif" font-weight="600" font-size="32" fill="#94A3B8" letter-spacing="8">
    SOLAR • WIND • BESS • MICROGRID ENGINEERING PLATFORM • v1.0.0 LTS
  </text>

  <!-- Bottom Edge Energy Gradient Bar -->
  <rect x="0" y="2140" width="3840" height="20" fill="url(#energyGrad)"/>
</svg>
