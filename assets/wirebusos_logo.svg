<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E22"/>
      <stop offset="100%" stop-color="#0D1417"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CE293"/>
      <stop offset="100%" stop-color="#1FA35C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bgGradT)"/>

  <!-- window frame -->
  <rect x="96" y="128" width="320" height="256" rx="20" fill="none" stroke="url(#termGrad)" stroke-width="10"/>
  <!-- title bar -->
  <line x1="96" y1="180" x2="416" y2="180" stroke="url(#termGrad)" stroke-width="8"/>
  <circle cx="128" cy="154" r="8" fill="url(#termGrad)"/>
  <circle cx="154" cy="154" r="8" fill="url(#termGrad)" opacity="0.5"/>
  <circle cx="180" cy="154" r="8" fill="url(#termGrad)" opacity="0.3"/>

  <!-- prompt caret -->
  <path d="M 130 230 L 170 260 L 130 290" fill="none" stroke="#FFD36E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="190" y1="290" x2="240" y2="290" stroke="#FFD36E" stroke-width="12" stroke-linecap="round"/>

  <!-- small bolt, the "energy" in the software -->
  <path d="M 320 210 L 286 274 L 308 274 L 300 330 L 344 260 L 320 260 Z" fill="url(#termGrad)"/>
</svg>
